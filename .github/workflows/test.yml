name: Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        run: dotnet test src/CodingWithCalvin.MCPServer.Tests/CodingWithCalvin.MCPServer.Tests.csproj -c Release
